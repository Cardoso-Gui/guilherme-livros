name: Public navigation regression
on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'supabase/functions/amazon-click/**'
      - '.github/workflows/public-navigation.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify dashboard bundle is current
        run: |
          pnpm run build:dashboard
          git diff --exit-code -- assets/js/dashboard.js assets/js/dashboard.LICENSE.txt
      - run: npx playwright install --with-deps chromium
      - name: Check public navigation at mobile, tablet and desktop widths
        run: |
          python3 -m http.server 8765 > /tmp/site-server.log 2>&1 &
          node tests/mobile-navigation.cjs
      - name: Check catalog, news, readers and retired URLs
        run: |
          node tests/site-regression.cjs
          node tests/news-pagination.cjs
          node tests/analytics.cjs
          node tests/footer-panel.cjs
          node tools/build-favicon.cjs
          git diff --exit-code -- favicon.ico assets/favicon-16.png assets/favicon-32.png assets/apple-touch-icon.png
          node tests/favicon.cjs
          node --test supabase/functions/amazon-click/handler.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-regression-evidence
          path: test-results/
